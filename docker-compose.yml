services:
  chat2work-mcp:
    build: .
    image: chat2work-mcp:local
    restart: unless-stopped
    # Localhost-only. Point your existing reverse proxy (the one already in
    # front of DEEIX) at this port for signed download links. No DEEIX change.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./config.yaml:/etc/chat2work/config.yaml:ro
      - chat2work_data:/data
    networks:
      - deeix-chat

volumes:
  chat2work_data:
    name: chat2work-mcp-data

networks:
  deeix-chat:
    external: true
    name: deeix-chat-network
